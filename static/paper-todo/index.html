<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Privacy Paper Punch List</title><meta name="robots" content="noindex"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style id="css">
:root{
  --bg:#F5F7F5; --surface:#FFFFFF; --ink:#1B211E; --ink-2:#5B6763; --ink-3:#8A948F; --line:#DCE2DE; --line-2:#EDF0EE;
  --accent:#0F6B55; --accent-ink:#0A5443; --accent-soft:#E2F1EB;
  --h:#B1261F; --h-bg:#FBEBE9; --m:#9D6300; --m-bg:#FBF0DA; --l:#4F6169; --l-bg:#E8EEF1;
  --done:#7F8985; --focus:#0F6B55;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151918; --surface:#1C2220; --ink:#E5E9E6; --ink-2:#9BA6A1; --ink-3:#6F7A75; --line:#2B3431; --line-2:#222A27;
    --accent:#5FC9A8; --accent-ink:#86DCC1; --accent-soft:#1B3A31;
    --h:#F29189; --h-bg:#3B1F1D; --m:#EFB85C; --m-bg:#3A2D14; --l:#A7B4BA; --l-bg:#22303A;
    --done:#6C7773; --focus:#5FC9A8;
  }
}
:root[data-theme="dark"]{
  --bg:#151918; --surface:#1C2220; --ink:#E5E9E6; --ink-2:#9BA6A1; --ink-3:#6F7A75; --line:#2B3431; --line-2:#222A27;
  --accent:#5FC9A8; --accent-ink:#86DCC1; --accent-soft:#1B3A31;
  --h:#F29189; --h-bg:#3B1F1D; --m:#EFB85C; --m-bg:#3A2D14; --l:#A7B4BA; --l-bg:#22303A;
  --done:#6C7773; --focus:#5FC9A8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--accent-ink)}
code{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--line-2);padding:.05em .3em;border-radius:3px}
.wrap{max-width:80ch;margin:0 auto;padding:32px 20px 96px}
header.top{display:flex;flex-direction:column;gap:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap}
h1{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,4vw,38px);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
.meter{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end}
.meter .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2)}
.meter .num b{color:var(--ink);font-weight:500}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
.sevrow{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px;line-height:1;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.H{background:var(--h)} .dot.M{background:var(--m)} .dot.L{background:var(--l)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 0 8px;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line-2)}
.controls input[type=search]{flex:1 1 220px;min-width:180px;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.controls input[type=search]::placeholder{color:var(--ink-3)}
.toggle{font-size:13.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.status{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);margin-left:auto;min-height:1em}
.status.warn{color:var(--m)}
.banner{margin:14px 0 0;padding:10px 12px;border-radius:6px;background:var(--m-bg);color:var(--ink);font-size:14px;border:1px solid transparent}
.summary{margin:26px 0 8px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.summary h2{font-family:"Source Serif 4",Georgia,serif;font-size:17px;font-weight:600;margin:0 0 8px;color:var(--ink)}
.summary ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px;color:var(--ink-2)}
.summary li::marker{color:var(--accent)}
section.sec{margin-top:34px}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.sec-head .letter{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:26px;line-height:1;color:var(--accent)}
.sec-head h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:20px;margin:0;flex:1;text-wrap:balance}
.sec-head .count{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
ul.items{list-style:none;margin:0;padding:0}
li.item{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
li.item:last-child{border-bottom:0}
li.item[hidden]{display:none}
.check{position:relative;width:22px;height:22px;margin-top:2px;cursor:pointer}
.check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.check .box{position:absolute;inset:0;border:1.5px solid var(--ink-3);border-radius:5px;background:var(--surface);transition:background .15s,border-color .15s}
.check .box::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--surface);border-width:0 2.2px 2.2px 0;transform:rotate(45deg) scale(0);transition:transform .15s}
.check input:checked + .box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .box::after{transform:rotate(45deg) scale(1)}
.check input:focus-visible + .box{outline:2px solid var(--focus);outline-offset:2px}
.check input:disabled + .box{opacity:.55;cursor:default}
.where{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.sev{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;line-height:1;padding:4px 6px;border-radius:4px;letter-spacing:.04em}
.sev.H{color:var(--h);background:var(--h-bg)} .sev.M{color:var(--m);background:var(--m-bg)} .sev.L{color:var(--l);background:var(--l-bg)}
.anchor{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);font-weight:500;word-break:break-word}
.text{margin:0;font-size:15.5px;color:var(--ink);max-width:72ch}
li.item.done .anchor,li.item.done .text{color:var(--done)}
li.item.done .anchor{text-decoration:line-through;text-decoration-color:var(--ink-3)}
li.item.done .sev{opacity:.55}
.empty{color:var(--ink-3);font-size:14px;padding:10px 0}
footer.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:grid;gap:4px}
@media (max-width:560px){ .wrap{padding:22px 14px 80px} .sec-head .letter{font-size:22px} .text{font-size:15px} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

.tag{font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1;padding:4px 6px;border-radius:4px;letter-spacing:.03em;color:var(--accent-ink);background:var(--accent-soft)}
.tag.new{color:var(--m);background:var(--m-bg)}
.meta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.controls input[type=text]{font:inherit;font-size:14px;width:9.5em;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.controls input[type=text]::placeholder{color:var(--ink-3)}
.live{display:inline-flex;align-items:center;gap:6px}
.live .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s ease-out infinite}
.live.off .pulse{background:var(--ink-3);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.note{font-size:13.5px;color:var(--ink-2);margin:6px 0 0}

.controls input[type=password]{font:inherit;font-size:13px;width:15em;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-size:13px;padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink-3)} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.controls input:focus-visible,.gh input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gh{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;color:var(--ink-2)}
.gh b{color:var(--ink);font-weight:600}
.gh input[type=password]{font:inherit;font-size:13px;width:15em;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.gh details{font-size:13.5px;flex-basis:100%} .gh summary{cursor:pointer;color:var(--accent-ink)}
.gh ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.item .edit{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);text-decoration:none;margin-left:auto}
.item .edit:hover{color:var(--accent-ink);text-decoration:underline}
.gh .edit{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);text-decoration:none}
.statusblock{margin:18px 0 0;font-size:14.5px;color:var(--ink-2)} .statusblock ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;max-width:min(90vw,60ch);box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:5}
.toast[hidden]{display:none}
</style></head><body><div id="root"></div><script id="app">
(function(){
  var OWNER='annienobear', REPO='annienobear.github.io', BRANCH='main', PATH='static/paper-todo/PAPER_TODO.md';
  var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+PATH;
  var EDIT_URL='https://github.com/'+OWNER+'/'+REPO+'/edit/'+BRANCH+'/'+PATH;
  var HIST_URL='https://github.com/'+OWNER+'/'+REPO+'/commits/'+BRANCH+'/'+PATH;
  var LS_PREFS='papertodo.prefs', LS_TOKEN='papertodo.gh_token';
  var prefs={sev:'all',hideDone:false,q:''}; try{ var p=JSON.parse(localStorage.getItem(LS_PREFS)||'{}'); if(p&&typeof p==='object'){ prefs.sev=p.sev||'all'; prefs.hideDone=!!p.hideDone; prefs.q=p.q||''; } }catch(e){}
  var token=''; try{ token=localStorage.getItem(LS_TOKEN)||''; }catch(e){}
  var ghUser=null, doc=null, sha=null, etag=null, lastLoaded=null, statusMsg='Loading…', statusWarn=false, busy=false, pollTimer=null, toastTimer=null;
  var root=document.getElementById('root');

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*([^*]+)\*/g,'<em>$1</em>'); }
  function savePrefs(){ try{ localStorage.setItem(LS_PREFS,JSON.stringify(prefs)); }catch(e){} }
  function b64decode(b){ return decodeURIComponent(Array.prototype.map.call(atob(b.replace(/\n/g,'')),function(c){ return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2); }).join('')); }
  function b64encode(s){ return btoa(encodeURIComponent(s).replace(/%([0-9A-F]{2})/g,function(_,h){ return String.fromCharCode(parseInt(h,16)); })); }
  function toast(msg){ var t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; },7000); }

  // ---- Markdown -> model (mirrors the Python generator) ----
  function parse(md){
    var lines=md.split(/\r?\n/), sections=[], summary=[], status=[], cur=null, title='';
    lines.forEach(function(ln,idx){
      if(ln.indexOf('# ')===0){ title=ln.slice(2).trim(); return; }
      if(ln.indexOf('## ')===0){ var t=ln.slice(3).trim(); var m=/^([A-F])\.\s+(.*)$/.exec(t);
        if(/^executive/i.test(t)) cur={key:'S'}; else if(/^status/i.test(t)) cur={key:'T'}; else if(m){ cur={key:m[1],title:m[2],items:[]}; sections.push(cur); } else cur=null; return; }
      if(!cur || ln.indexOf('- ')!==0) return;
      if(cur.key==='S'){ summary.push(ln.slice(2).trim()); return; }
      if(cur.key==='T'){ status.push(ln.slice(2).trim()); return; }
      var im=/^- \[( |x|X)\] \[([HML])\]\s*(.*)$/.exec(ln); if(!im) return;
      var done=im[1]!==' ', sev=im[2], rest=im[3].trim(), resolved=null, note=null, isNew=false;
      var rm=/^✅ \*fixed in ([^*]+)\*(?: \((.*?)\))? —\s*/.exec(rest); if(rm){ resolved=rm[1]; note=rm[2]||null; rest=rest.slice(rm[0].length); }
      if(rest.indexOf('🆕')===0){ isNew=true; rest=rest.slice(2).trim(); }
      var idm=/^([A-F]\d+)\s*·\s*/.exec(rest), id=idm?idm[1]:cur.key+(cur.items.length+1); if(idm) rest=rest.slice(idm[0].length);
      var lead='', text=rest, k=rest.indexOf(' — '); if(k>-1 && k<=150){ lead=rest.slice(0,k).trim(); text=rest.slice(k+3).trim(); }
      cur.items.push({id:id,sev:sev,done:done,lead:lead,text:text,resolved:resolved,note:note,isNew:isNew,line:idx,raw:ln});
    });
    return {title:title,summary:summary,status:status,sections:sections};
  }
  function items(){ var a=[]; if(doc) doc.sections.forEach(function(s){ s.items.forEach(function(it){ a.push(it); }); }); return a; }
  function matches(it){ if(prefs.sev!=='all'&&it.sev!==prefs.sev) return false; if(prefs.hideDone&&it.done) return false; if(prefs.q){ var q=prefs.q.toLowerCase(); if((it.lead+' '+it.text+' '+it.id).toLowerCase().indexOf(q)<0) return false; } return true; }
  function counts(){ var c={total:0,done:0,open:{H:0,M:0,L:0}}; items().forEach(function(it){ c.total++; if(it.done) c.done++; else c.open[it.sev]++; }); return c; }

  // ---- GitHub I/O ----
  function headers(){ var h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; if(token) h['Authorization']='Bearer '+token; return h; }
  function liveLabel(){ return 'Live from GitHub'+(lastLoaded?' · '+lastLoaded.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}):''); }
  function load(force){
    var h=headers(); if(etag&&!force) h['If-None-Match']=etag;
    return fetch(API+'?ref='+BRANCH+(force?'&_='+Date.now():''),{headers:h,cache:'no-store'}).then(function(r){
      if(r.status===304){ statusMsg=liveLabel(); statusWarn=false; render(); return; }
      if(r.status===403||r.status===429) return fallbackLoad('GitHub API rate limit reached — showing the published copy (may be a minute behind)');
      if(!r.ok) throw new Error('HTTP '+r.status);
      etag=r.headers.get('ETag');
      return r.json().then(function(j){ sha=j.sha; doc=parse(b64decode(j.content)); lastLoaded=new Date(); statusMsg=liveLabel(); statusWarn=false; render(); });
    }).catch(function(e){ return fallbackLoad('Couldn’t reach GitHub ('+e.message+') — showing the published copy'); });
  }
  function fallbackLoad(msg){
    return fetch('PAPER_TODO.md',{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(md){ if(!doc) doc=parse(md); statusMsg=msg; statusWarn=true; render(); })
      .catch(function(){ statusMsg=msg+' — and no published copy yet'; statusWarn=true; render(); });
  }
  function schedulePoll(){ clearTimeout(pollTimer); pollTimer=setTimeout(function(){ load(false).then(schedulePoll); }, token?30000:120000); }
  function whoami(){ if(!token){ ghUser=null; return Promise.resolve(); } return fetch('https://api.github.com/user',{headers:headers()}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(u){ ghUser=u.login; }).catch(function(){ ghUser=null; }); }

  function toggle(it,checked){
    if(!token){ openEditor(it,checked); return; }
    if(busy){ toast('One change at a time — wait a second and try again'); render(); return; }
    busy=true; it.done=checked; statusMsg='Saving to GitHub…'; statusWarn=false; render();
    commitToggle(it,checked,2).then(function(){ busy=false; statusMsg=liveLabel(); render(); })
      .catch(function(e){ busy=false; it.done=!checked; statusWarn=true; statusMsg='Couldn’t save: '+e.message; render(); toast(e.message); });
  }
  function commitToggle(it,checked,retries){
    // read the current file (fresh sha), flip this item's line, PUT it back; retry once on a sha race
    return fetch(API+'?ref='+BRANCH+'&_='+Date.now(),{headers:headers(),cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('GitHub read failed (HTTP '+r.status+')'); return r.json(); }).then(function(j){
      var md=b64decode(j.content), lines=md.split('\n');
      var key=it.raw.replace(/^- \[( |x|X)\]/,'- [?]'), idx=-1;
      for(var i=0;i<lines.length;i++){ if(lines[i].replace(/^- \[( |x|X)\]/,'- [?]')===key){ idx=i; break; } }
      if(idx<0) throw new Error('This item’s line changed on GitHub — refresh the page and try again');
      lines[idx]=lines[idx].replace(/^- \[( |x|X)\]/, checked?'- [x]':'- [ ]');
      var msg=(checked?'Done: ':'Reopened: ')+it.id+(it.lead?' — '+it.lead.slice(0,70):'');
      var hh=headers(); hh['Content-Type']='application/json';
      return fetch(API,{method:'PUT',headers:hh,body:JSON.stringify({message:msg,content:b64encode(lines.join('\n')),sha:j.sha,branch:BRANCH})}).then(function(r){
        if(r.status===409||r.status===422){ if(retries>0) return commitToggle(it,checked,retries-1); throw new Error('Someone else saved at the same moment — try again'); }
        if(r.status===401) throw new Error('GitHub rejected the token — reconnect with a valid fine-grained token');
        if(r.status===403||r.status===404) throw new Error('This token can’t write to '+REPO+' — it needs Contents: Read and write on this repo, and you must be a collaborator');
        if(!r.ok) throw new Error('GitHub write failed (HTTP '+r.status+')');
        return r.json();
      }).then(function(res){ sha=res.content&&res.content.sha; etag=null; doc=parse(lines.join('\n')); lastLoaded=new Date(); });
    });
  }
  function openEditor(it,checked){
    window.open(EDIT_URL,'_blank','noopener');
    render();
    toast('GitHub’s editor opened in a new tab: find the line for '+it.id+' (Ctrl/Cmd+F) and change “[ ]” to “'+(checked?'[x]':'[ ]')+'”, then Commit changes. Connect a token above for one-click ticks.');
  }
  function connect(){
    var el=document.getElementById('tok'), v=(el&&el.value||'').trim();
    if(!v){ toast('Paste a fine-grained GitHub token first'); return; }
    token=v; try{ localStorage.setItem(LS_TOKEN,token); }catch(e){}
    statusMsg='Checking token…'; render();
    whoami().then(function(){
      if(!ghUser){ token=''; try{ localStorage.removeItem(LS_TOKEN); }catch(e){} toast('GitHub didn’t accept that token'); }
      else toast('Connected as @'+ghUser+' — ticks now commit with one click');
      etag=null; return load(true);
    }).then(schedulePoll);
  }
  function disconnect(){ token=''; ghUser=null; try{ localStorage.removeItem(LS_TOKEN); }catch(e){} render(); schedulePoll(); }

  // ---- render ----
  function render(){
    var c=counts(), pct=c.total?Math.round(100*c.done/c.total):0, h='<div class="wrap">';
    h+='<header class="top"><div class="eyebrow"><span>'+OWNER+'/'+REPO+'</span><span>'+esc(PATH.split('/').pop())+'</span><span>'+c.total+' items</span></div>';
    h+='<h1>'+esc((doc&&doc.title)||'Robot Privacy Paper Punch List')+'</h1>';
    h+='<div class="meter"><div class="num"><b>'+c.done+'</b> of '+c.total+' done · '+pct+'%</div><div class="sevrow">';
    [['all','All open',c.open.H+c.open.M+c.open.L],['H','High',c.open.H],['M','Medium',c.open.M],['L','Low',c.open.L]].forEach(function(s){ h+='<button type="button" class="chip" data-sev="'+s[0]+'" aria-pressed="'+(prefs.sev===s[0])+'">'+(s[0]==='all'?'':'<span class="dot '+s[0]+'"></span>')+esc(s[1])+' <b>'+s[2]+'</b></button>'; });
    h+='</div><div class="bar"><span style="width:'+pct+'%"></span></div></div></header>';
    h+='<div class="gh">';
    if(token&&ghUser) h+='<span>Ticking as <b>@'+esc(ghUser)+'</b> — each tick is a commit to <code>'+esc(PATH)+'</code>.</span><button type="button" class="btn" id="disc">Disconnect</button>';
    else if(token) h+='<span>Checking your GitHub token…</span>';
    else {
      h+='<span><b>To tick items:</b> click a box to open the file on GitHub and change <code>[ ]</code> to <code>[x]</code> — or connect once for one-click ticks:</span>';
      h+='<input type="password" id="tok" placeholder="Fine-grained GitHub token" autocomplete="off" aria-label="GitHub token"><button type="button" class="btn primary" id="conn">Connect</button>';
      h+='<details><summary>How to get a token (about a minute)</summary><ol>'
        +'<li>Be a collaborator on <a href="https://github.com/'+OWNER+'/'+REPO+'" target="_blank" rel="noopener">'+esc(OWNER+'/'+REPO)+'</a> (Shirley adds you under Settings → Collaborators).</li>'
        +'<li>GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token.</li>'
        +'<li>Repository access: <b>Only select repositories</b> → '+esc(REPO)+'. Permissions → Repository permissions → <b>Contents: Read and write</b>. Nothing else.</li>'
        +'<li>Paste it here. It is kept in this browser only (localStorage) and sent only to api.github.com.</li></ol></details>';
    }
    h+='<a class="edit" href="'+HIST_URL+'" target="_blank" rel="noopener" style="margin-left:auto">history ↗</a></div>';
    if(doc&&doc.status.length){ h+='<div class="statusblock"><b>Status</b><ul>'; doc.status.forEach(function(s){ h+='<li>'+fmt(s)+'</li>'; }); h+='</ul></div>'; }
    if(doc&&doc.summary.length){ h+='<div class="summary"><h2>What matters most</h2><ul>'; doc.summary.forEach(function(s){ h+='<li>'+fmt(s)+'</li>'; }); h+='</ul></div>'; }
    h+='<div class="controls"><input type="search" id="q" placeholder="Search items, files, numbers…" value="'+esc(prefs.q)+'" aria-label="Search items">';
    h+='<label class="toggle"><input type="checkbox" id="hideDone"'+(prefs.hideDone?' checked':'')+'> Hide done</label>';
    h+='<button type="button" class="btn" id="refresh" title="Reload from GitHub now">Refresh</button>';
    h+='<span class="status'+(statusWarn?' warn':'')+'" aria-live="polite"><span class="live'+((statusWarn||!doc)?' off':'')+'"><span class="pulse"></span>'+esc(statusMsg)+'</span></span></div>';
    if(!doc){ h+='<p class="empty">'+(statusWarn?'The list could not be loaded.':'Loading the list from GitHub…')+'</p>'; }
    else doc.sections.forEach(function(s){
      var vis=s.items.filter(matches), doneN=s.items.filter(function(it){ return it.done; }).length;
      h+='<section class="sec" id="sec-'+s.key+'"><div class="sec-head"><span class="letter">'+s.key+'</span><h2>'+esc(s.title)+'</h2><span class="count">'+doneN+'/'+s.items.length+' done</span></div>';
      if(!vis.length){ h+='<p class="empty">Nothing here matches the current filter.</p>'; }
      else { h+='<ul class="items">'; vis.forEach(function(it){
        h+='<li class="item sev-'+it.sev+(it.done?' done':'')+'" data-id="'+it.id+'">';
        h+='<label class="check" title="'+(it.done?'Mark as open':'Mark as done')+'"><input type="checkbox" data-id="'+it.id+'"'+(it.done?' checked':'')+(busy?' disabled':'')+' aria-label="'+esc(it.id)+' done"><span class="box"></span></label>';
        h+='<div class="body"><div class="where"><span class="sev '+it.sev+'">'+it.sev+'</span>';
        if(it.lead) h+='<span class="anchor">'+fmt(it.lead)+'</span>';
        if(it.resolved) h+='<span class="tag">fixed in '+esc(it.resolved)+'</span>';
        if(it.isNew) h+='<span class="tag new">new</span>';
        h+='<a class="edit" href="'+EDIT_URL+'" target="_blank" rel="noopener" title="Edit this line on GitHub">'+esc(it.id)+' · edit ↗</a>';
        h+='</div><p class="text">'+fmt(it.text)+'</p>';
        if(it.resolved&&it.note) h+='<p class="note">'+fmt(it.note)+'</p>';
        h+='</div></li>'; }); h+='</ul>'; }
      h+='</section>';
    });
    h+='<footer class="foot"><span>The list is the Markdown file <a href="https://github.com/'+OWNER+'/'+REPO+'/blob/'+BRANCH+'/'+PATH+'" target="_blank" rel="noopener">'+esc(PATH)+'</a>; this page re-reads it every '+(token?'30 s':'2 min')+' and whenever you return to the tab, so everyone sees the same ticks. Search and filters stay on your device.</span>';
    h+='<span>Every item was re-verified against the Overleaf tree and the analysis CSVs; line numbers refer to the commit named in the file header.</span></footer></div><div id="toast" class="toast" hidden></div>';
    var prev=document.getElementById('toast'), keep=(prev&&!prev.hidden)?prev.textContent:null;
    root.innerHTML=h;
    if(keep){ var t=document.getElementById('toast'); t.textContent=keep; t.hidden=false; }
    wire();
  }
  function wire(){
    root.querySelectorAll('.chip[data-sev]').forEach(function(b){ b.addEventListener('click',function(){ prefs.sev=b.getAttribute('data-sev'); savePrefs(); render(); }); });
    var q=document.getElementById('q'); q.addEventListener('input',function(){ prefs.q=q.value; savePrefs(); var pos=q.selectionStart; render(); var q2=document.getElementById('q'); q2.focus(); try{ q2.setSelectionRange(pos,pos); }catch(e){} });
    document.getElementById('hideDone').addEventListener('change',function(e){ prefs.hideDone=e.target.checked; savePrefs(); render(); });
    document.getElementById('refresh').addEventListener('click',function(){ statusMsg='Refreshing…'; render(); load(true).then(schedulePoll); });
    var conn=document.getElementById('conn'); if(conn){ conn.addEventListener('click',connect); document.getElementById('tok').addEventListener('keydown',function(e){ if(e.key==='Enter') connect(); }); }
    var disc=document.getElementById('disc'); if(disc) disc.addEventListener('click',disconnect);
    root.querySelectorAll('input[type=checkbox][data-id]').forEach(function(cb){ cb.addEventListener('change',function(){ var id=cb.getAttribute('data-id'); var it=items().filter(function(x){ return x.id===id; })[0]; if(it) toggle(it,cb.checked); }); });
  }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) load(false).then(schedulePoll); });
  render();
  whoami().then(function(){ return load(true); }).then(schedulePoll);
})();
</script></body></html>
